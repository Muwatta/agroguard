{% extends "base.html" %}

{% block title %}Settings{% endblock %}
{% block page_title %}System Settings{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6">
        <div class="stat-card">
            <h5 class="mb-4">Camera Configuration</h5>
            <div class="mb-3">
                <label class="form-label">Camera URL</label>
                <input type="text" class="form-control" value="http://10.18.128.170:8080/video">
            </div>
            <div class="mb-3">
                <label class="form-label">Motion Sensitivity</label>
                <input type="range" class="form-range" min="1" max="100" value="75">
            </div>
        </div>
    </div>
    
    <div class="col-lg-6">
        <div class="stat-card">
            <h5 class="mb-4">Detection Settings</h5>
            <div class="mb-3">
                <label class="form-label">Confidence Threshold</label>
                <input type="number" class="form-control" value="0.6" step="0.1" min="0" max="1">
            </div>
            <div class="mb-3">
                <label class="form-label">Visit Window (seconds)</label>
                <input type="number" class="form-control" value="300">
            </div>
        </div>
    </div>
</div>
{% endblock %}
